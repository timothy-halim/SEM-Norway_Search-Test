<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEM Video Channel Search Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #transparent;
    }
    .search-container {
      max-width: 650px;
      margin: 0 auto;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .search-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    .search-button {
      padding: 12px 20px;
      background-color: #0066cc;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .video-card {
      display: flex;
      gap: 16px;
      border: 1px solid #e0e0e0;
      padding: 12px;
      border-radius: 8px;
      background-color: #fff;
    }
    @media (max-width: 480px) {
      .video-card {
        flex-direction: column;
      }
      .video-card iframe {
        width: 100%;
        height: 180px;
      }
    }
  </style>
</head>
<body>

  <div class="search-container">
    <div class="search-box">
      <input type="text" id="ytQuery" class="search-input" placeholder="Search using a keyword.">
      <button onclick="searchChannelOnly()" class="search-button">Søk</button>
    </div>
    <div id="ytResults" class="results-list"></div>
  </div>

  <script>
    const API_KEY = 'AIzaSyA2tUQbVzVkRU4btZvb6R3X2T-rwLnqAAA';
    const CHANNEL_ID = 'UCjgNt7-F3PmXD_K1x5E058g';

    async function searchChannelOnly() {
      const query = document.getElementById('ytQuery').value.trim();
      const resultsContainer = document.getElementById('ytResults');
      
      if (!query) return;
      resultsContainer.innerHTML = '<p style="color: #666;">Search using a keyword.</p>';

      const endpoint = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&q=${encodeURIComponent(query)}&type=video&maxResults=8&key=${API_KEY}`;

      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        
        resultsContainer.innerHTML = '';
        
        if (!data.items || data.items.length === 0) {
          resultsContainer.innerHTML = '<p>Ingen treff i videotitler eller beskrivelser.</p>';
          return;
        }

        data.items.forEach(item => {
          const videoId = item.id.videoId;
          const title = item.snippet.title;
          const description = item.snippet.description;

          const card = `
            <div class="video-card">
              <iframe width="200" height="115" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen style="border-radius: 4px; flex-shrink: 0;"></iframe>
              <div>
                <h4 style="margin: 0 0 6px 0; font-size: 16px;">${title}</h4>
                <p style="margin: 0; font-size: 13px; color: #555; line-height: 1.4;">${description}</p>
              </div>
            </div>
          `;
          resultsContainer.innerHTML += card;
        });
      } catch (err) {
        console.error(err);
        resultsContainer.innerHTML = '<p style="color: red;">This is a test page to illustrate the video search.</p>';
      }
    }
  </script>
</body>
</html>
